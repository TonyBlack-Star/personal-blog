<!-- Luxseen 自定义背景：极淡渐变，仅亮色主题生效；暗色保持 PaperMod 默认 -->
<style>
  :root {
    --luxseen-light-bg:
      radial-gradient(1100px 520px at 12% -8%, rgba(210, 195, 170, .16), transparent 72%),
      linear-gradient(180deg, #fdfcfa 0%, #f7f6f3 52%, #f1f3f5 100%);
  }

  :root[data-theme="light"] body {
    background-image: var(--luxseen-light-bg);
    background-attachment: fixed;
  }

  @media (prefers-color-scheme: light) {
    :root[data-theme="auto"] body {
      background-image: var(--luxseen-light-bg);
      background-attachment: fixed;
    }
  }
</style>

{{ if eq .RelPermalink "/about/" }}
<!-- Luxseen 履历页专用排版：仅输出到 /about/ -->
<style>
  :root { --luxseen-resume-scope: 1; }

  .post-single .breadcrumbs,
  .post-single .post-meta,
  .post-single > details.toc,
  .post-single .share-buttons { display: none; }

  /* 履历页不显示页头（大标题「履历」+ 简介段落），正文直接从板块内容开始；
     <title> 与 meta description 仍保留在 head 中，供搜索引擎与分享卡片使用 */
  .post-single .post-header { display: none; }
  .post-single .post-title { margin-bottom: .4rem; }
  .post-single .post-description {
    font-size: .95rem;
    line-height: 1.7;
    color: var(--secondary);
    max-width: 46rem;
  }

  /* 正文整体收小 2px：18px → 16px（标题字号另由 .lux-section-title 定义，不受影响） */
  .post-single .post-content { font-size: 16px; }

  /* 板块标题（核心成果 / 核心能力 / 工作经历）统一样式定义在
     assets/css/extended/luxseen.css 的 .lux-section-title，此处仅修正首块上间距 */
  .post-single .post-content > h2:first-child { margin-top: .6rem; }
  .post-single .post-content ul { padding-left: 1.35rem; }
  .post-single .post-content li { margin: .35rem 0; line-height: 1.75; }
  .post-single .post-content strong { color: var(--primary); }

  .post-single .post-content details {
    margin: .85rem 0;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--entry);
    padding: 0 1.1rem;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .post-single .post-content details:hover { border-color: var(--tertiary); }
  .post-single .post-content details[open] {
    border-color: var(--tertiary);
    box-shadow: 0 2px 14px rgba(0, 0, 0, .05);
    padding-bottom: .35rem;
  }
  .post-single .post-content details > summary {
    display: flex;
    align-items: center;
    gap: .7rem;
    list-style: none;
    cursor: pointer;
    padding: .85rem 0;
    font-size: .98rem;
    line-height: 1.5;
  }
  .post-single .post-content details > summary::-webkit-details-marker { display: none; }
  .post-single .post-content details > summary::before {
    content: "";
    flex: 0 0 auto;
    width: .42rem;
    height: .42rem;
    border-right: 2px solid var(--secondary);
    border-bottom: 2px solid var(--secondary);
    transform: rotate(-45deg);
    transition: transform .2s ease;
  }
  .post-single .post-content details[open] > summary::before { transform: rotate(45deg); }
  .post-single .post-content details > p:first-of-type { margin-top: .3rem; }
  .post-single .post-content details > ul { margin-top: .3rem; }

  /* ===== 板块折叠：核心成果 / 核心能力 默认收起，标题沿用 .lux-section-title 样式 ===== */
  .post-single .post-content details.lux-section {
    margin: .4rem 0 1.4rem;
    border: 0;
    border-radius: 0;
    background: transparent;
    padding: 0;
    box-shadow: none;
    transition: none;
  }
  .post-single .post-content details.lux-section[open] {
    border-color: transparent;
    box-shadow: none;
    padding-bottom: 0;
  }
  .post-single .post-content details.lux-section:first-of-type { margin-top: .2rem; }

  .post-single .post-content details.lux-section > summary.lux-section-title {
    display: flex;
    align-items: center;
    gap: .65rem;
    margin: 0;
    padding: .55rem .9rem;
    border-radius: 4px;
    background: linear-gradient(90deg, rgba(193, 70, 75, .11), rgba(193, 70, 75, .025) 68%, transparent 100%);
    font-size: 1.18rem;
    font-weight: 700;
    line-height: 1.5;
    color: #c1464b;
    list-style: none;
    cursor: pointer;
  }
  .post-single .post-content details.lux-section > summary.lux-section-title::-webkit-details-marker { display: none; }

  /* 左侧红竖条（覆盖通用 summary 的箭头样式） */
  .post-single .post-content details.lux-section > summary.lux-section-title::before {
    content: "";
    flex: 0 0 auto;
    width: .3rem;
    height: 1.1rem;
    border: 0;
    border-radius: 2px;
    background: #c1464b;
    transform: none;
  }
  /* 右侧折叠指示箭头 */
  .post-single .post-content details.lux-section > summary.lux-section-title::after {
    content: "";
    flex: 0 0 auto;
    margin-left: auto;
    width: .42rem;
    height: .42rem;
    border-right: 2px solid currentColor;
    border-bottom: 2px solid currentColor;
    transform: rotate(-45deg) translateY(-1px);
    opacity: .55;
    transition: transform .2s ease;
  }
  .post-single .post-content details.lux-section[open] > summary.lux-section-title::after {
    transform: rotate(45deg) translateY(-1px);
  }
  .post-single .post-content details.lux-section > .lux-section-body { padding: .55rem .1rem .2rem; }

  :root[data-theme="dark"] .post-single .post-content details.lux-section > summary.lux-section-title {
    background: linear-gradient(90deg, rgba(226, 134, 138, .15), transparent 78%);
    color: #e2868a;
  }
  :root[data-theme="dark"] .post-single .post-content details.lux-section > summary.lux-section-title::before { background: #e2868a; }

  @media (prefers-color-scheme: dark) {
    :root[data-theme="auto"] .post-single .post-content details.lux-section > summary.lux-section-title {
      background: linear-gradient(90deg, rgba(226, 134, 138, .15), transparent 78%);
      color: #e2868a;
    }
    :root[data-theme="auto"] .post-single .post-content details.lux-section > summary.lux-section-title::before { background: #e2868a; }
  }
  /* ===== 「其他补充 · 建议读」正文分级：主标题 / 小标题 ===== */
  .post-single .post-content .lux-read-h {
    margin: 1.9rem 0 .5rem;
    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.6;
    letter-spacing: .01em;
    color: var(--primary);
  }
  .post-single .post-content .lux-read-h:first-child { margin-top: .1rem; }
  .post-single .post-content .lux-read-sub {
    margin: 1.35rem 0 .45rem;
    padding-left: .55rem;
    border-left: 2px solid rgba(193, 70, 75, .45);
    font-size: 1rem;
    font-weight: 700;
    line-height: 1.6;
    color: var(--primary);
  }
  :root[data-theme="dark"] .post-single .post-content .lux-read-sub { border-left-color: rgba(226, 134, 138, .5); }
  @media (prefers-color-scheme: dark) {
    :root[data-theme="auto"] .post-single .post-content .lux-read-sub { border-left-color: rgba(226, 134, 138, .5); }
  }

  /* ===== 「建议读」内层折叠：每个小标题独立收起，样式与 .lux-read-h 一致 ===== */
  .post-single .post-content details.lux-read {
    margin: 1.6rem 0 .2rem;
    border: 0;
    border-radius: 0;
    background: transparent;
    padding: 0;
    box-shadow: none;
    transition: none;
  }
  .post-single .post-content details.lux-read:first-of-type { margin-top: .1rem; }
  .post-single .post-content details.lux-read[open] {
    border-color: transparent;
    box-shadow: none;
    padding-bottom: 0;
  }

  .post-single .post-content details.lux-read > summary.lux-read-h {
    display: flex;
    align-items: center;
    gap: .55rem;
    margin: 0;
    padding: .3rem .1rem .3rem 0;
    border-radius: 3px;
    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.6;
    letter-spacing: .01em;
    color: var(--primary);
    list-style: none;
    cursor: pointer;
    user-select: none;
  }
  .post-single .post-content details.lux-read > summary.lux-read-h::-webkit-details-marker { display: none; }

  /* 左侧细红竖条（覆盖通用 summary 的箭头样式） */
  .post-single .post-content details.lux-read > summary.lux-read-h::before {
    content: "";
    flex: 0 0 auto;
    width: 3px;
    height: .92rem;
    border: 0;
    border-radius: 2px;
    background: rgba(193, 70, 75, .55);
    transform: none;
    transition: background .2s ease;
  }
  .post-single .post-content details.lux-read:hover > summary.lux-read-h::before { background: #c1464b; }

  /* 右侧折叠指示箭头 */
  .post-single .post-content details.lux-read > summary.lux-read-h::after {
    content: "";
    flex: 0 0 auto;
    margin-left: auto;
    width: .32rem;
    height: .32rem;
    border-right: 2px solid currentColor;
    border-bottom: 2px solid currentColor;
    transform: rotate(-45deg) translateY(-1px);
    opacity: .38;
    transition: transform .2s ease;
  }
  .post-single .post-content details.lux-read[open] > summary.lux-read-h::after {
    transform: rotate(45deg) translateY(-1px);
  }

  .post-single .post-content details.lux-read > .lux-read-body { padding: .15rem 0 0 .1rem; }
  .post-single .post-content details.lux-read > .lux-read-body > .lux-read-sub:first-child { margin-top: .5rem; }

  :root[data-theme="dark"] .post-single .post-content details.lux-read > summary.lux-read-h::before {
    background: rgba(226, 134, 138, .55);
  }
  :root[data-theme="dark"] .post-single .post-content details.lux-read:hover > summary.lux-read-h::before { background: #e2868a; }
  @media (prefers-color-scheme: dark) {
    :root[data-theme="auto"] .post-single .post-content details.lux-read > summary.lux-read-h::before {
      background: rgba(226, 134, 138, .55);
    }
    :root[data-theme="auto"] .post-single .post-content details.lux-read:hover > summary.lux-read-h::before { background: #e2868a; }
  }
</style>
{{ end }}
