baseURL = "https://luxseen.com/"

locale = "zh-CN"

defaultContentLanguage = "zh-cn"

title = "Luxseen | 碎碎念"

theme = "PaperMod"


enableRobotsTXT = true



# =====================================
# 分类系统
# =====================================

[taxonomies]

category = "categories"

tag = "tags"



# =====================================
# 分页
# =====================================

[pagination]

pagerSize = 10



# =====================================
# 网站输出
# =====================================

[outputs]

home = [
    "HTML",
    "RSS",
    "JSON"
]



# =====================================
# 网站参数
# =====================================

[params]


author = "Tony"


description = "Luxseen 是一个记录 DTC 独立站运营、Shopify、AI工具、数据分析、全球消费趋势与个人成长的个人博客。"


defaultTheme = "auto"



# 阅读体验

ShowReadingTime = true

ShowShareButtons = true

ShowPostNavLinks = true

ShowBreadCrumbs = true

ShowCodeCopyButtons = true

ShowToc = true



# 首页文章数量

mainSections = [
    "posts",
    "dtc"
]



# =====================================
# 全站默认分享图（PaperMod 据此生成 og:image / twitter:image）
# =====================================

images = [
    "/images/og-default.png"
]


# 中文日期格式

DateFormat = "2006年1月2日"



# =====================================
# 结构化数据：个人博客用 Person，不用 Organization
# =====================================

[params.schema]

publisherType = "Person"



# =====================================
# 顶部 Logo
# =====================================

[params.label]

text = "Luxseen"

icon = "/images/luxseen-logo-70.png"

iconHeight = 35

iconWidth = 35



# =====================================
# 网站图标
# =====================================

[params.assets]

favicon = "/images/favicon.ico"

favicon16x16 = "/images/favicon-16.png"

favicon32x32 = "/images/favicon-32.png"

apple_touch_icon = "/images/apple-touch-icon.png"

safari_pinned_tab = "/images/favicon-32.png"



# =====================================
# 首页
# =====================================

[params.homeInfoParams]


Title = "你好，欢迎来到 Luxseen 👋"


Content = """

记录实践，沉淀方法。


这里记录：

- DTC 独立站运营
- Shopify 实践
- AI 工具应用
- 数据分析
- 全球消费趋势
- 阅读与个人成长


把经历变成经验，
把经验沉淀成方法。

<div class="lux-cta-row">
<a class="lux-cta" href="/dtc/">读文章 →</a>
<a class="lux-cta lux-cta--ghost" href="/about/">看履历</a>
</div>

"""



# =====================================
# 搜索
# =====================================

[params.fuseOpts]

isCaseSensitive = false

shouldSort = true

location = 0

distance = 1000

threshold = 0.4

minMatchCharLength = 2

keys = [
    "title",
    "permalink",
    "summary",
    "content"
]



# =====================================
# 顶部导航
# =====================================


[[menu.main]]

identifier = "home"

name = "首页"

url = "/"

weight = 1



[[menu.main]]

identifier = "dtc"

name = "DTC"

url = "/dtc/"

weight = 20



[[menu.main]]

identifier = "about"

name = "履历"

url = "/about/"

weight = 10



[[menu.main]]

identifier = "tags"

name = "标签"

url = "/tags/"

weight = 40



[[menu.main]]

identifier = "search"

name = "搜索"

url = "/search/"

weight = 50



# =====================================
# Markdown 渲染
# =====================================

[markup]


[markup.goldmark]


[markup.goldmark.renderer]

unsafe = true



[markup.highlight]

noClasses = false

lineNos = true

codeFences = true
